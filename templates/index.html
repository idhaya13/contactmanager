<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Contact Manager</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* Reset defaults */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    html, body {
      height: 100%;
      overflow: hidden; /* Prevent scrolling */
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f0f4f8, #d9e2ec);
      color: #333;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 40px;
      color: #2c3e50;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .links a {
      display: inline-block;
      padding: 12px 20px;
      font-size: 1.1rem;
      font-weight: 600;
      color: white;
      background: #4CAF50;
      text-decoration: none;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: all 0.3s ease;
    }

    .links a:hover {
      background: #45a049;
      transform: translateY(-2px);
      box-shadow: 0 6px 10px rgba(0,0,0,0.15);
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 2rem;
      }
      .links a {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <h1>Business AI Contact Manager</h1>
  <div class="links">
    <a href="/contacts">📋 View All Contacts</a>
    <a href="/contacts/add">➕ Add New Contact</a>
  </div>
</body>
</html>
