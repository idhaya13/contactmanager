<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business AI Contact Manager</title>
  <style>
    :root {
      --bg-dark: #121212;
      --bg-surface: #1e1e2d;
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0a0;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --border: #333;
      --focus-glow: rgba(139, 92, 246, 0.3);
    }

    /* Reset defaults */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    html, body {
      height: 100%;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--bg-dark);
      color: var(--text-primary);
      text-align: center;
      padding: 0;
      position: relative;
      min-height: 100vh;
      overflow-y: auto;
    }

    /* Navbar */
    nav {
      background: var(--bg-surface);
      padding: 15px 20px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
    }

    nav a {
      color: var(--text-primary);
      text-decoration: none;
      font-weight: 600;
    }

    nav .logo {
      color: var(--accent);
      font-size: 1.5rem;
      font-weight: bold;
    }

    nav .nav-links {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    /* Content container */
    .content-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 60px);
      padding: 80px 20px 20px;
      box-sizing: border-box;
    }

    /* Infinite falling particles */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--accent);
      border-radius: 50%;
      opacity: 0;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translateY(-10px);
        opacity: 0;
      }
      10% {
        opacity: 0.8;
      }
      90% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(105vh);
        opacity: 0;
      }
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 40px;
      color: var(--accent);
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
      animation: fadeIn 1.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }

    .links a {
      display: inline-block;
      padding: 12px 20px;
      font-size: 1.1rem;
      font-weight: 600;
      color: white;
      background: var(--accent);
      text-decoration: none;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .links a::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: 0.5s;
    }

    .links a:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 10px rgba(0, 0, 0, 0.25);
    }

    .links a:hover::before {
      left: 100%;
    }

    .links a:active {
      transform: scale(0.98);
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 2rem;
      }

      .links a {
        width: 100%;
        text-align: center;
      }

      nav {
        flex-direction: column;
        gap: 15px;
        padding: 10px;
      }

      nav .nav-links {
        flex-direction: column;
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="logo">Business AI Contact Manager</a>
    <div class="nav-links">
      <a href="/contacts">Contacts</a>
      <a href="/profile">Profile</a>
    </div>
  </nav>

  <div class="particles" id="particles"></div>

  <div class="content-container">
    <h1>Business AI Contact Manager</h1>
    <div class="links">
      <a href="/contacts">📋 View All Contacts</a>
      <a href="/contacts/add">➕ Add New Contact</a>
    </div>
  </div>

  <script>
    const particlesContainer = document.getElementById('particles');
    const particleCount = 50;
    for (let i = 0; i < particleCount; i++) {
      const particle = document.createElement('div');
      particle.classList.add('particle');
      particle.style.left = Math.random() * 100 + 'vw';
      particle.style.animationDuration = 3 + Math.random() * 7 + 's';
      particle.style.animationDelay = Math.random() * 5 + 's';
      particlesContainer.appendChild(particle);
    }
  </script>
</body>
</html>
