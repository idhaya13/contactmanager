<nav style="
  background: var(--bg-surface);
  padding: 15px 20px;
  border-radius: 10px;
  margin-bottom: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
  position: fixed;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 40px);
  max-width: 1200px;
  z-index: 1000;
">
  <div style="display: flex; align-items: center; gap: 20px;">
    <!-- Previous Page Button -->
    <a href="#" onclick="history.back()" style="
      color: var(--text-primary);
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 6px;
      background: var(--border);
      transition: all 0.2s;
    " onmouseover="this.style.background='var(--bg-dark)'" onmouseout="this.style.background='var(--border)'">
      ← Previous
    </a>

    <a href="/" style="color: var(--accent); font-size: 1.5rem; font-weight: bold; text-decoration: none;">
      Business AI Contact Manager
    </a>
  </div>

  <div style="display: flex; gap: 15px; align-items: center;">
    <a href="/contacts" style="color: var(--text-primary); text-decoration: none;">Contacts</a>
    <a href="/profile" style="color: var(--text-primary); text-decoration: none;">Profile</a>

    <!-- Next Page Button -->
    <a href="#" onclick="history.forward()" style="
      color: var(--text-primary);
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 6px;
      background: var(--border);
      transition: all 0.2s;
    " onmouseover="this.style.background='var(--bg-dark)'" onmouseout="this.style.background='var(--border)'">
      Next →
    </a>
  </div>
</nav>
