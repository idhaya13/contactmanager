<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broadcast Message - {{ company }}</title>
    <style>
        :root {
            --bg-dark: #121212;
            --bg-surface: #1e1e2d;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --border: #333;
            --focus-glow: rgba(139, 92, 246, 0.3);
        }

        /* Reset defaults */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            position: relative;
            overflow-y: auto;
        }

        /* Infinite falling particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10px);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(105vh);
                opacity: 0;
            }
        }

        h1 {
            color: var(--accent);
            text-align: center;
            margin-bottom: 20px;
        }

        .broadcast-container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--bg-surface);
            padding: 20px;
            border-radius: 12px;
            position: relative;
            z-index: 1;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }

        select,
        textarea {
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            border: none;
            font-size: 16px;
            background: var(--bg-surface);
            color: var(--text-primary);
        }

        textarea {
            min-height: 150px;
            resize: vertical;
            margin-top: 5px;
        }

        .members-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px;
            margin-top: 10px;
        }

        .member-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
        }

        .member-item:last-child {
            border-bottom: none;
        }

        .member-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .member-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: var(--border);
            color: white;
            margin-right: 10px;
        }

        #selectAll {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            cursor: pointer;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .members-count {
            font-weight: bold;
            margin-left: auto;
        }

        .success-message {
            background: #eaffea;
            color: #27ae60;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: none;
        }

        .error-message {
            background: #ffeaea;
            color: #d63031;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body>
    {% include 'navbar.html' %}
    <div class="particles" id="particles"></div>
    <h1>Broadcast Message - {{ company }}</h1>
    <div class="broadcast-container">
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>
        <div class="form-group">
            <label>Recipients</label>
            <div class="checkbox-group">
                <input type="checkbox" id="selectAll" checked>
                <label for="selectAll">Select All Contacts</label>
                <span class="members-count">{{ contacts|length }} members</span>
            </div>
        </div>
        <div class="form-group">
            <label for="messageTemplate">Select Message Template</label>
            <select id="messageTemplate">
                <option value="">Custom Message</option>
                <option value="welcome">Welcome Message</option>
                <option value="meeting">Meeting Reminder</option>
                <option value="update">Company Update</option>
                <option value="holiday">Holiday Greeting</option>
            </select>
        </div>
        <div class="form-group">
            <label for="customMessage">Message</label>
            <textarea id="customMessage" placeholder="Type your message..."></textarea>
        </div>
        <div class="members-list" id="membersList">
            {% for c in contacts %}
            <div class="member-item">
                <div class="member-info">
                    <div class="member-avatar">
                        {{ c.name.split(' ')[0][0] }}{{ c.name.split(' ')[-1][0] }}
                    </div>
                    <div>
                        <div>{{ c.name }}</div>
                        <div style="font-size: 12px; color: var(--text-secondary);">
                            {{ c.role if c.role else 'No Role' }} • {{ c.department if c.department else 'No Dept' }}
                        </div>
                    </div>
                </div>
                <input type="checkbox" class="member-checkbox" data-id="{{ c.id }}" checked>
            </div>
            {% endfor %}
        </div>
        <div style="margin-top: 20px; display: flex; justify-content: flex-end;">
            <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
            <button class="btn btn-primary" id="sendBtn">Send Broadcast</button>
        </div>
    </div>
    <script>
        // Particles
        const particlesContainer = document.getElementById('particles');
        const particleCount = 50;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.animationDuration = 3 + Math.random() * 7 + 's';
            particle.style.animationDelay = Math.random() * 5 + 's';
            particlesContainer.appendChild(particle);
        }

        // Form logic
        document.addEventListener('DOMContentLoaded', function() {
            const selectAll = document.getElementById('selectAll');
            const memberCheckboxes = document.querySelectorAll('.member-checkbox');
            const messageTemplate = document.getElementById('messageTemplate');
            const customMessage = document.getElementById('customMessage');
            const sendBtn = document.getElementById('sendBtn');
            const cancelBtn = document.getElementById('cancelBtn');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');

            selectAll.addEventListener('change', () => {
                memberCheckboxes.forEach(cb => cb.checked = selectAll.checked);
            });

            memberCheckboxes.forEach(cb => {
                cb.addEventListener('change', () => {
                    const allChecked = Array.from(memberCheckboxes).every(c => c.checked);
                    const noneChecked = Array.from(memberCheckboxes).every(c => !c.checked);
                    selectAll.checked = allChecked;
                    selectAll.indeterminate = !allChecked && !noneChecked;
                });
            });

            messageTemplate.addEventListener('change', function() {
                const templates = {
                    welcome: "Welcome to our team! We're excited to have you on board.",
                    meeting: "Reminder: Team meeting tomorrow at 10 AM.",
                    update: "Important company update: Please check the latest announcements.",
                    holiday: "Wishing you a wonderful holiday season!"
                };
                customMessage.value = templates[this.value] || '';
            });

            sendBtn.addEventListener('click', () => {
                const selectedIds = Array.from(memberCheckboxes)
                    .filter(c => c.checked)
                    .map(c => c.dataset.id);
                const message = customMessage.value.trim();
                if (!message) return showError("Please enter a message.");
                if (selectedIds.length === 0) return showError("Please select at least one recipient.");

                fetch("/broadcast/send", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ ids: selectedIds, message: message })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) showSuccess("Message sent successfully!");
                })
                .catch(err => showError("Failed to send message."));
            });

            cancelBtn.addEventListener('click', () => {
                if (confirm("Cancel broadcasting?")) {
                    customMessage.value = '';
                }
            });

            function showError(msg) {
                errorMessage.textContent = msg;
                errorMessage.style.display = 'block';
                successMessage.style.display = 'none';
                setTimeout(() => errorMessage.style.display = 'none', 4000);
            }

            function showSuccess(msg) {
                successMessage.textContent = msg;
                successMessage.style.display = 'block';
                errorMessage.style.display = 'none';
                setTimeout(() => successMessage.style.display = 'none', 4000);
            }
        });
    </script>
</body>
</html>
